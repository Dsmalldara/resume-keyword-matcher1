app = "resume-keyword-matcher"
primary_region = "ord"

[build]
dockerfile = "backend/Dockerfile"

[env]
NODE_ENV = "production"

[http_service]
internal_port = 4000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0

[[services]]
protocol = "tcp"
internal_port = 4000

[[services.ports]]
port = 80
handlers = ["http"]

[[services.ports]]
port = 443
handlers = ["http", "tls"]

[deploy]
strategy = "rolling"
wait_timeout = "300s"
