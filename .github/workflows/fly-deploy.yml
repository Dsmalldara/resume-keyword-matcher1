name: Fly Deploy
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:  # Allows manual trigger
      
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      
      # Create app if it doesn't exist (will skip if already exists)
      - name: Create app if needed
        run: flyctl apps create resume-checker --org personal || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      
      - run: flyctl deploy --remote-only -a resume-checker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}